name: Keepalive - Render Free Tier

# Strategy: ping once per job, triggered every 14 minutes.
# The Render free tier sleeps after 15 minutes of inactivity.
# Pinging every 14 minutes ensures we always stay within the window.
#
# Active window:  08:00 - 02:00 BRT  (18 hours/day) — manhã até madrugada
# Sleep window:   02:00 - 08:00 BRT  (6 hours/day)  — madrugada sem uso
#
# BRT = UTC-3, so in UTC:
#   Active: 11:00 UTC -> 05:00 UTC (next day)
#   Sleep:  05:00 UTC -> 11:00 UTC
#
# Compute budget estimate (750 hrs/month free tier):
#   ~77 runs/day × ~3 min each ≈ 231 min/day (GitHub Actions)
#   18 hrs/day active × 30 days ≈ 540 hrs/month Render instance hours
#   Well within the 750 hr/month free tier limit.

on:
  schedule:
    # Every 14 minutes from 11:00 to 23:59 UTC  (08:00-20:59 BRT)
    - cron: '0,14,28,42,56 11-23 * * *'
    # Every 14 minutes from 00:00 to 04:56 UTC  (21:00-01:56 BRT)
    - cron: '0,14,28,42,56 0-4 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    name: Ping API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API once
        run: |
          echo "--- Ping at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ---"

          RESPONSE=$(curl \
            --silent \
            --max-time 60 \
            --retry 2 \
            --retry-delay 10 \
            --write-out "%{http_code}" \
            --output /dev/null \
            "${{ vars.RENDER_URL }}/standings")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ge 100 ] && [ "$RESPONSE" -lt 600 ]; then
            echo "✅ API is alive (HTTP $RESPONSE)."
          else
            echo "⚠️  WARNING: No response from server (curl failed or timed out)"
            exit 1
          fi
