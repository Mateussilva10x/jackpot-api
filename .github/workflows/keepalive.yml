name: Keepalive - Render Free Tier

# Strategy: ping every 14 minutes, 24/7.
# The Render free tier sleeps after 15 minutes of inactivity.
# Pinging every 14 minutes ensures we always stay within the window.
#
# Copa do Mundo: usuário pode palpitar até 5min antes de qualquer jogo,
# incluindo jogos de madrugada — sistema deve estar vivo o tempo todo.
#
# Active window: 24hrs/day (sem janela de sono)
#
# Compute budget estimate (750 hrs/month free tier):
#   ~103 runs/day × ~3 min each ≈ 154 hrs/month (GitHub Actions — OK)
#   24 hrs/day × 30 days = 720 hrs/month Render instance hours
#   Dentro do limite de 750 hrs/mês com ~30 hrs de margem.

on:
  schedule:
    # Every 14 minutes, all day, every day
    - cron: '0,14,28,42,56 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    name: Ping API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API once
        run: |
          echo "--- Ping at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ---"

          RESPONSE=$(curl \
            --silent \
            --max-time 60 \
            --retry 2 \
            --retry-delay 10 \
            --write-out "%{http_code}" \
            --output /dev/null \
            "${{ vars.RENDER_URL }}/standings")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ge 100 ] && [ "$RESPONSE" -lt 600 ]; then
            echo "✅ API is alive (HTTP $RESPONSE)."
          else
            echo "⚠️  WARNING: No response from server (curl failed or timed out)"
            exit 1
          fi
